<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Circle background -->
  <circle cx="100" cy="100" r="95" fill="url(#grad)" opacity="0.15"/>

  <!-- Main logo shape - stylized C for CDMI -->
  <g transform="translate(100, 100)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="url(#grad)" stroke-width="8"/>

    <!-- Inner accent -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#0ea5e9" stroke-width="3" opacity="0.6"/>

    <!-- Letter C shape -->
    <path d="M -45,-30 A 50,50 0 0,0 -45,30" fill="none" stroke="white" stroke-width="12" stroke-linecap="round"/>

    <!-- Accent dot -->
    <circle cx="35" cy="-25" r="6" fill="#0ea5e9"/>
    <circle cx="35" cy="25" r="6" fill="#6366f1"/>
  </g>

  <!-- Text fallback (displays if SVG rendering is minimal) -->
  <text x="100" y="185" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white" opacity="0.3">CDMI</text>
</svg>
